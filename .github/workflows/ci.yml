name: Atlas CI/CD Pipeline

on:
  push:
    branches: [ main, master, 'feature/**', 'team/**' ]
  pull_request:
    branches: [ main, master ]

env:
  LLM_PROVIDER: mock

jobs:
  security-audit:
    name: "Tier 0: Security & Secret Audit Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify No Tracked .env Files in Git
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)'; then
            echo "::error::Tracked .env file detected in repository!"
            exit 1
          fi
          echo "No .env files are tracked in git."

      - name: Static Secret Pattern Scan
        run: |
          # Scan tracked files for committed secrets
          if git grep -EI "nvapi-[a-zA-Z0-9_-]{30,}|npg_[a-zA-Z0-9_-]{12,}|sk_live_[a-zA-Z0-9]{24,}" -- ':!backend/tests/' ':!*.md' ':!scratch/'; then
            echo "::error::Potential live cloud API key or DB secret found in tracked source files!"
            exit 1
          fi
          # Verify test fixture files do not hardcode real-looking live credentials
          if git grep -EI "sk_live_[a-zA-Z0-9]{24,}|ghp_[a-zA-Z0-9]{36}" -- 'backend/tests/'; then
            echo "::error::Real-looking live credential found in test fixtures!"
            exit 1
          fi
          echo "No hardcoded high-entropy secrets found in tracked source code."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Dependency Vulnerability Audit (pip-audit)
        working-directory: ./backend
        run: |
          pip-audit -r requirements.txt --desc on

      - name: Verify PyPI Dependencies Legitimacy (Anti-Slopsquatting)
        working-directory: ./backend
        run: |
          python -c "
          import urllib.request, json
          with open('requirements.txt') as f:
              for line in f:
                  line = line.strip().split('#')[0].split(';')[0]
                  if not line or line.startswith('-'): continue
                  pkg = line.split('==')[0].split('>=')[0].split('<=')[0].split('[')[0].strip()
                  try:
                      url = f'https://pypi.org/pypi/{pkg}/json'
                      req = urllib.request.Request(url, headers={'User-Agent': 'Atlas-Security-Audit/1.0'})
                      with urllib.request.urlopen(req, timeout=5) as r:
                          assert r.status == 200
                      print(f'[OK] {pkg} verified on PyPI')
                  except Exception as e:
                      print(f'[FAIL] Failed to verify {pkg} on PyPI: {e}')
                      exit(1)
          "

  unit-tests:
    name: "Tier 1: Unit Tests"
    needs: [security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Core JavaScript Test Suites
        run: |
          node client-script/test_extension.js
          node client-script/test_secret_vault.js
          node client-script/test_dom_serializer_v2.js
          node client-script/test_goal_store.js
          node client-script/test_executor_v2.js
          node client-script/test_ws_client_stress.js
          node client-script/test_m7_adversarial_challenger2.js
          node client-script/test_sidebar_behavior.js
          node demo-site/test_fixtures.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run Models Unit Tests
        working-directory: ./backend
        run: pytest tests/test_models.py -v --tb=short

      - name: Run Action & Simplify Parser Unit Tests
        working-directory: ./backend
        run: pytest tests/test_action_parser.py -v --tb=short

      - name: Run LLM Client Unit Tests
        working-directory: ./backend
        run: pytest tests/test_llm_client.py -v --tb=short

      - name: Run Rate Limiter Unit Tests
        working-directory: ./backend
        run: pytest tests/test_rate_limiter.py -v --tb=short

  module-tests:
    name: "Tier 2: Module Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run Complete Backend Pytest Suites
        working-directory: ./backend
        env:
          LLM_PROVIDER: mock
        run: pytest tests/ -v --tb=short

      - name: Set up Node.js for Dashboard
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Build Dashboard Module
        working-directory: ./dashboard
        run: |
          npm ci
          npm run build

  system-tests:
    name: "Tier 3: System & E2E Tests"
    needs: [unit-tests, module-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run WebSocket Agent Pipeline System Tests
        working-directory: ./backend
        run: pytest tests/test_websocket.py -v --tb=short

      - name: Run Secret Leak Regression System Tests
        working-directory: ./backend
        run: pytest tests/test_secret_leak_regression.py -v --tb=short

      - name: Run End-to-End Multi-Service System Tests
        working-directory: ./backend
        run: pytest tests/test_system_e2e.py -v --tb=short

      - name: Run Replay Scenarios System Tests
        working-directory: ./backend
        env:
          LLM_PROVIDER: mock
        run: pytest tests/replay/test_replay_runner.py -v --tb=short

      - name: Set up Node.js for Playwright E2E
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Browsers
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Extension Harness
        run: node ci/e2e/harness.js

      - name: Run Playwright UI Sidebar Behavior Harness
        run: node ci/e2e/ui_sidebar_behavior.js

      - name: Run Playwright Axe-Core A11y Audit Harness
        run: node ci/e2e/a11y_axe.js

  extension-and-compliance:
    name: "Tier 4: Extension Packaging & WCAG AAA Accessibility"
    needs: [system-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r tests/requirements-test.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run Node Extension Unit Tests
        run: |
          node client-script/test_secret_vault.js
          node client-script/test_goal_store.js
          node client-script/test_executor_v2.js
          node client-script/test_dom_serializer_v2.js
          node client-script/test_audio_feedback.js
          node demo-site/test_fixtures.js

      - name: Run WCAG 2.2 AAA Accessibility Suite
        working-directory: ./backend
        run: pytest tests/test_a11y_compliance.py -v --tb=short

      - name: Run Presentation Deck Generator Test
        working-directory: ./backend
        run: pytest tests/test_pitch_deck.py -v --tb=short

      - name: Verify Extension Packaging Pipeline
        working-directory: ./backend
        run: pytest tests/test_extension_packager.py -v --tb=short

      - name: Build Release Extension Package
        run: python tools/package_extension.py

      - name: Run CI Gatekeeper Quality Floor Self-Check
        run: python3 ci/verify_all_tests_run.py
