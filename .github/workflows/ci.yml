name: Atlas CI/CD Pipeline

on:
  push:
    branches: [ main, master, 'feature/**', 'team/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    name: "Tier 1: Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Extension Unit Tests (Syntax & Manifest)
        run: node client-script/test_extension.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run Models Unit Tests
        working-directory: ./backend
        run: pytest tests/test_models.py -v --tb=short

      - name: Run Action & Simplify Parser Unit Tests
        working-directory: ./backend
        run: pytest tests/test_action_parser.py -v --tb=short

      - name: Run Rate Limiter Unit Tests
        working-directory: ./backend
        run: pytest tests/test_rate_limiter.py -v --tb=short

  module-tests:
    name: "Tier 2: Module Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run DB Utilities Module Tests
        working-directory: ./backend
        run: pytest tests/test_db_utils.py -v --tb=short

      - name: Run REST Routes Module Tests
        working-directory: ./backend
        run: pytest tests/test_routes_rest.py -v --tb=short

      - name: Set up Node.js for Dashboard
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Build Dashboard Module
        working-directory: ./dashboard
        run: |
          npm ci
          npm run build

  system-tests:
    name: "Tier 3: System Tests"
    needs: [unit-tests, module-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run WebSocket Agent Pipeline System Tests
        working-directory: ./backend
        run: pytest tests/test_websocket.py -v --tb=short

      - name: Run End-to-End Multi-Service System Tests
        working-directory: ./backend
        run: pytest tests/test_system_e2e.py -v --tb=short
