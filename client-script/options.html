<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Atlas Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="atlas-options">
    <header class="atlas-options-header">
      <h1>Atlas Settings</h1>
      <p>Manage the API key Atlas uses to talk to your backend.</p>
    </header>

    <form id="atlas-options-form" novalidate>
      <label for="api-key">
        API key
        <span class="atlas-hint">Starts with <code>atlas_</code> — get this from your Atlas dashboard.</span>
      </label>
      <div class="atlas-key-row">
        <input
          id="api-key"
          name="api-key"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="atlas_..."
        />
        <button type="button" id="toggle-visibility" aria-label="Show API key">
          Show
        </button>
      </div>

      <label for="base-url">
        Backend URL
        <span class="atlas-hint">Only change this if you're not running the default local backend.</span>
      </label>
      <input
        id="base-url"
        name="base-url"
        type="text"
        autocomplete="off"
        placeholder="http://localhost:8000"
      />

      <div class="atlas-actions">
        <button type="submit" id="save-btn">Save settings</button>
        <button type="button" id="clear-btn" class="atlas-secondary">Clear saved key</button>
      </div>

      <p id="atlas-status" role="status" aria-live="polite"></p>
    </form>

    <section class="atlas-secrets-section" aria-labelledby="saved-secrets-heading">
      <div class="atlas-secrets-header">
        <div>
          <h2 id="saved-secrets-heading">Saved Secrets</h2>
          <p class="atlas-hint">Sensitive values are encrypted and stored only in your local browser.</p>
        </div>
        <button type="button" id="clear-all-secrets-btn" class="atlas-secondary atlas-danger-btn">
          Clear everything
        </button>
      </div>

      <div id="secrets-container" class="atlas-secrets-list"></div>
      <p id="secrets-status" role="status" aria-live="polite"></p>
    </section>

    <section class="atlas-profile-section" aria-labelledby="profile-heading">
      <div class="atlas-profile-header">
        <div>
          <h2 id="profile-heading">User Profile</h2>
          <p class="atlas-hint">Locally encrypted profile data for universal automated form filling.</p>
        </div>
        <button type="button" id="clear-profile-btn" class="atlas-secondary atlas-danger-btn">
          Clear profile
        </button>
      </div>

      <form id="atlas-profile-form" novalidate>
        <div class="atlas-profile-grid">
          <div class="atlas-form-group">
            <label for="profile-given-name">Given name</label>
            <input id="profile-given-name" name="given_name" type="text" autocomplete="given-name" placeholder="Alice" />
          </div>
          <div class="atlas-form-group">
            <label for="profile-family-name">Family name</label>
            <input id="profile-family-name" name="family_name" type="text" autocomplete="family-name" placeholder="Smith" />
          </div>
          <div class="atlas-form-group">
            <label for="profile-full-name">Full name</label>
            <input id="profile-full-name" name="full_name" type="text" autocomplete="name" placeholder="Alice Smith" />
          </div>
          <div class="atlas-form-group">
            <label for="profile-email">Email</label>
            <input id="profile-email" name="email" type="email" autocomplete="email" placeholder="alice@example.com" />
          </div>
          <div class="atlas-form-group">
            <label for="profile-phone">Phone number</label>
            <input id="profile-phone" name="phone" type="tel" autocomplete="tel" placeholder="+15551234567" />
          </div>
          <div class="atlas-form-group">
            <label for="profile-address-1">Address line 1</label>
            <input id="profile-address-1" name="address_line1" type="text" autocomplete="address-line1" placeholder="123 Main St" />
          </div>
          <div class="atlas-form-group">
            <label for="profile-address-2">Address line 2</label>
            <input id="profile-address-2" name="address_line2" type="text" autocomplete="address-line2" placeholder="Apt 4B" />
          </div>
          <div class="atlas-form-group">
            <label for="profile-city">City</label>
            <input id="profile-city" name="city" type="text" autocomplete="address-level2" placeholder="Springfield" />
          </div>
          <div class="atlas-form-group">
            <label for="profile-region">State / Region</label>
            <input id="profile-region" name="region" type="text" autocomplete="address-level1" placeholder="IL" />
          </div>
          <div class="atlas-form-group">
            <label for="profile-postal-code">Postal / ZIP code</label>
            <input id="profile-postal-code" name="postal_code" type="text" autocomplete="postal-code" placeholder="62701" />
          </div>
          <div class="atlas-form-group">
            <label for="profile-country">Country</label>
            <input id="profile-country" name="country" type="text" autocomplete="country-name" placeholder="United States" />
          </div>
          <div class="atlas-form-group">
            <label for="profile-dob">Date of birth</label>
            <input id="profile-dob" name="date_of_birth" type="text" autocomplete="bday" placeholder="1990-01-15" />
          </div>
        </div>

        <div class="atlas-actions">
          <button type="submit" id="save-profile-btn">Save profile</button>
        </div>
        <p id="profile-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="secret-vault.js"></script>
  <script src="options.js"></script>
</body>
</html>
