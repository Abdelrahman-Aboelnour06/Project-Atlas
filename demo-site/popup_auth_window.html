<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Single Sign-On Authentication</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --primary: #1a56a0; --primary-dark: #0e3d7a; --primary-lt: #e8f0fb;
        --secondary: #107040; --danger: #b91c1c; --bg-page: #f8fafc;
        --card-bg: #ffffff; --border-color: #cbd5e1; --text-main: #0f172a;
        --text-muted: #475569; --radius: 8px; --shadow: 0 4px 12px rgba(0,0,0,0.06);
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg-page); color: var(--text-main); line-height: 1.5; padding: 20px 16px;
      }
      .popup-card {
        background: var(--card-bg); border-radius: var(--radius); padding: 24px;
        box-shadow: var(--shadow); border: 1px solid var(--border-color); max-width: 480px; margin: 0 auto;
      }
      header { text-align: center; margin-bottom: 20px; }
      h1 { font-size: 20px; color: var(--primary-dark); margin-bottom: 6px; }
      p.subtitle { color: var(--text-muted); font-size: 13px; }
      
      .form-group { margin-bottom: 16px; }
      label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
      input[type="text"], input[type="password"] {
        width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: var(--radius);
        font-size: 14px; outline: none;
      }
      input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-lt); }

      .checkbox-group { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; }
      .checkbox-group input { margin-top: 3px; }
      .checkbox-group label { font-weight: normal; font-size: 12px; color: var(--text-muted); }

      .btn {
        width: 100%; padding: 11px; border-radius: var(--radius); font-size: 15px; font-weight: 600;
        cursor: pointer; border: none; margin-top: 10px; transition: background 0.15s ease;
      }
      .btn-primary { background: var(--primary); color: white; }
      .btn-primary:hover { background: var(--primary-dark); }
      .btn-secondary { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); }
      .btn-secondary:hover { background: #e2e8f0; }

      .status-banner {
        display: none; background: #dcfce7; border: 1px solid #86efac; color: #166534;
        padding: 12px; border-radius: var(--radius); margin-top: 14px; text-align: center; font-weight: 600;
      }
      .webauthn-box {
        margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--border-color); text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="popup-card">
      <header>
        <h1>Enterprise Identity Sign-In</h1>
        <p class="subtitle">Authorize CareLink Telehealth Portal to access credentials</p>
      </header>

      <form id="auth-form" onsubmit="handleAuthSubmit(event)">
        <div class="form-group">
          <label for="auth-username">User Email / Account ID</label>
          <input id="auth-username" type="text" name="username" value="user@example.com" required />
        </div>

        <div class="form-group">
          <label for="auth-password">Password / Passcode</label>
          <input id="auth-password" type="password" name="password" value="AtlasSecret2026!" required />
        </div>

        <div class="checkbox-group">
          <input id="auth-consent" type="checkbox" checked required />
          <label for="auth-consent">Grant CareLink Portal permission to verify session identity.</label>
        </div>

        <button id="auth-submit-btn" class="btn btn-primary" type="submit">
          Sign In & Complete Authorization
        </button>
      </form>

      <div id="auth-success-banner" class="status-banner" role="status">
        ✓ Authorization Granted. Closing window...
      </div>

      <div class="webauthn-box">
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">Or use browser-native passkey:</p>
        <button id="btn-simulate-webauthn" class="btn btn-secondary" type="button" onclick="triggerWebAuthn()">
          Sign In with Passkey / WebAuthn
        </button>
        <div id="webauthn-active-notice" style="display: none; font-size: 12px; color: var(--primary); margin-top: 6px;">
          [Passkey Ceremony Active: Waiting for browser-native prompt]
        </div>
      </div>
    </div>

    <script>
      function handleAuthSubmit(event) {
        if (event) event.preventDefault();

        const username = document.getElementById('auth-username').value.trim() || 'user@example.com';
        const banner = document.getElementById('auth-success-banner');
        if (banner) banner.style.display = 'block';

        const authPayload = {
          type: 'AUTH_COMPLETE',
          email: username,
          token: 'ATLAS_OAUTH_BEARER_' + Math.random().toString(36).substring(2, 10),
          timestamp: Date.now()
        };

        // 1. Post message to opener window if available
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage(authPayload, '*');
          } catch (e) {
            console.warn('Failed to postMessage to opener:', e);
          }
        }

        // 2. Broadcast via localStorage for multi-tab / _blank listeners
        try {
          localStorage.setItem('atlas_auth_result', JSON.stringify(authPayload));
        } catch (_) {}

        // 3. Mark completion flag on window object
        window.__ATLAS_AUTH_COMPLETED__ = true;

        // Auto close after brief display
        setTimeout(() => {
          try {
            window.close();
          } catch (_) {}
        }, 300);
      }

      function triggerWebAuthn() {
        const notice = document.getElementById('webauthn-active-notice');
        if (notice) notice.style.display = 'block';

        // Trigger navigator.credentials.get if available
        if (navigator.credentials && navigator.credentials.get) {
          try {
            navigator.credentials.get({
              publicKey: {
                challenge: new Uint8Array([1, 2, 3, 4]),
                rpId: window.location.hostname || 'localhost',
                allowCredentials: [],
                userVerification: 'preferred'
              }
            }).catch(() => {
              // Graceful catch for test environment
            });
          } catch (_) {}
        }
      }
    </script>
  </body>
</html>
