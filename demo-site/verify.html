<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two-Step Verification — CareLink Portal</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --primary: #1a56a0; --primary-dark: #0e3d7a; --primary-lt: #e8f0fb;
        --secondary: #107040; --danger: #b91c1c; --bg-page: #f8fafc;
        --card-bg: #ffffff; --border-color: #cbd5e1; --text-main: #0f172a;
        --text-muted: #475569; --radius: 8px; --shadow: 0 4px 12px rgba(0,0,0,0.06);
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg-page); color: var(--text-main); line-height: 1.5; padding: 40px 15px;
      }
      .container {
        max-width: 460px; margin: 0 auto; background: var(--card-bg); border-radius: var(--radius);
        padding: 36px 30px; box-shadow: var(--shadow); border: 1px solid var(--border-color); text-align: center;
      }
      h1 { font-size: 22px; color: var(--primary-dark); margin-bottom: 8px; }
      p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
      .form-group { margin-bottom: 20px; text-align: left; }
      label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
      input.otp-input {
        width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: var(--radius);
        font-size: 20px; letter-spacing: 4px; text-align: center; font-family: monospace; outline: none;
      }
      input.otp-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-lt); }
      .submit-btn {
        width: 100%; padding: 12px; background: var(--primary); color: white; border: none;
        border-radius: var(--radius); font-size: 16px; font-weight: 600; cursor: pointer;
        transition: background 0.15s ease;
      }
      .submit-btn:hover { background: var(--primary-dark); }
      .footer-links { margin-top: 20px; font-size: 13px; }
      .footer-links a { color: var(--primary); text-decoration: none; }
      .footer-links a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Verify Your Identity</h1>
      <p class="subtitle">A 6-digit security code was sent to your phone. Enter it below to complete sign-in.</p>

      <form id="verify-form" action="account.html" method="GET">
        <div class="form-group">
          <label for="otp">Security Code (OTP)</label>
          <input
            type="text"
            id="otp"
            name="otp"
            class="otp-input"
            autocomplete="one-time-code"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            placeholder="123456"
            required
          />
        </div>

        <button type="submit" id="verify-btn" class="submit-btn">Verify and Continue</button>
      </form>

      <div class="footer-links">
        <a href="signup.html">← Back to registration</a>
      </div>
    </div>
  </body>
</html>
