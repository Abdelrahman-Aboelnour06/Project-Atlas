<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portal Category Tiles</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; background: #f1f5f9; }
    .tile-container { display: flex; gap: 1rem; margin-bottom: 2rem; }
    .category-tile {
      background: #ffffff; border: 2px solid #e2e8f0; border-radius: 8px;
      padding: 1.25rem 2rem; font-size: 1.1rem; font-weight: 600; cursor: pointer;
      color: #1e293b; transition: all 0.2s ease;
    }
    .category-tile:hover, .category-tile:focus { border-color: #2563eb; background: #eff6ff; }
    #main-panel {
      background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px;
      padding: 2rem; min-height: 200px;
    }
    .service-btn {
      display: inline-block; margin-right: 1rem; margin-top: 1rem;
      background: #2563eb; color: #fff; padding: 0.6rem 1.2rem;
      border: none; border-radius: 4px; text-decoration: none; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>Portal Services Hub</h1>
  </header>

  <nav class="tile-container">
    <button id="tile-vehicles" class="category-tile" type="button" role="button">My Vehicles</button>
    <button id="tile-licenses" class="category-tile" type="button" role="button">My Licenses</button>
    <button id="tile-records" class="category-tile" type="button" role="button">Civil Affairs</button>
  </nav>

  <main id="main-panel">
    <div id="initial-panel-content">
      <h2>Welcome to Citizen Services</h2>
      <p>Please select a category tile above to view available electronic services and manage your applications.</p>
    </div>
  </main>

  <script>
    const panel = document.getElementById('main-panel');
    const tileVehicles = document.getElementById('tile-vehicles');
    const tileLicenses = document.getElementById('tile-licenses');
    const tileRecords = document.getElementById('tile-records');

    tileVehicles.addEventListener('click', () => {
      setTimeout(() => {
        panel.innerHTML = `
          <div id="vehicles-panel-content">
            <h2>Vehicle Violations and Services</h2>
            <p>View registered traffic violations, settle fines, and renew vehicle permits.</p>
            <div>
              <button id="btn-inquire-violations" class="service-btn" type="button">Inquire Violations</button>
              <button id="btn-renew-registration" class="service-btn" type="button">Renew Registration</button>
              <a id="link-traffic-units" class="service-btn" href="#traffic-units">Traffic Units Directory</a>
            </div>
          </div>
        `;
      }, 400);
    });

    tileLicenses.addEventListener('click', () => {
      setTimeout(() => {
        panel.innerHTML = `
          <div id="licenses-panel-content">
            <h2>Driver License Management</h2>
            <p>Renew personal driving license or request replacement card.</p>
            <div>
              <button id="btn-renew-driving-license" class="service-btn" type="button">Renew License</button>
            </div>
          </div>
        `;
      }, 400);
    });

    tileRecords.addEventListener('click', () => {
      setTimeout(() => {
        panel.innerHTML = `
          <div id="records-panel-content">
            <h2>Civil Affairs Records</h2>
            <p>Issue family records and national identity replacements.</p>
            <div>
              <button id="btn-issue-record" class="service-btn" type="button">Issue Record</button>
            </div>
          </div>
        `;
      }, 400);
    });
  </script>
</body>
</html>
