<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Registration — CareLink Portal</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --primary: #1a56a0; --primary-dark: #0e3d7a; --primary-lt: #e8f0fb;
        --secondary: #107040; --danger: #b91c1c; --bg-page: #f8fafc;
        --card-bg: #ffffff; --border-color: #cbd5e1; --text-main: #0f172a;
        --text-muted: #475569; --radius: 8px; --shadow: 0 4px 12px rgba(0,0,0,0.06);
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg-page); color: var(--text-main); line-height: 1.5; padding: 30px 15px;
      }
      .container {
        max-width: 560px; margin: 0 auto; background: var(--card-bg); border-radius: var(--radius);
        padding: 32px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
      }
      header { text-align: center; margin-bottom: 24px; }
      h1 { font-size: 24px; color: var(--primary-dark); margin-bottom: 8px; }
      p.subtitle { color: var(--text-muted); font-size: 14px; }
      .nav-links { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
      .nav-links a { color: var(--primary); text-decoration: none; font-size: 14px; font-weight: 500; }
      .nav-links a:hover { text-decoration: underline; }
      .form-group { margin-bottom: 18px; }
      label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
      input[type="text"], input[type="email"], input[type="password"], input[type="tel"], select {
        width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: var(--radius);
        font-size: 15px; outline: none; transition: border-color 0.15s ease;
      }
      input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-lt); }
      .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-top: 10px; }
      .checkbox-group input { margin-top: 3px; cursor: pointer; }
      .checkbox-group label { font-weight: normal; font-size: 13px; color: var(--text-muted); margin-bottom: 0; }
      .submit-btn {
        width: 100%; padding: 12px; background: var(--primary); color: white; border: none;
        border-radius: var(--radius); font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px;
        transition: background 0.15s ease, opacity 0.15s ease;
      }
      .submit-btn:disabled {
        background: #94a3b8; cursor: not-allowed; opacity: 0.7;
      }
      .submit-btn:not(:disabled):hover { background: var(--primary-dark); }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="timetable.html">Timetable</a>
          <a href="hostile-form.html">Specialized Intake</a>
          <a href="slow.html">System Check</a>
        </div>
        <h1>Create Patient Account</h1>
        <p class="subtitle">Complete your details to access CareLink Telehealth Services</p>
      </header>

      <form id="signup-form" action="verify.html" method="GET" novalidate>
        <div class="form-group">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" name="full_name" placeholder="Alice Smith" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="alice@example.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required autocomplete="tel" />
        </div>

        <div class="form-group">
          <label for="country">Country / Region</label>
          <select id="country" name="country" required>
            <option value="">Select country...</option>
            <option value="US">United States</option>
            <option value="CA">Canada</option>
            <option value="UK">United Kingdom</option>
            <option value="AU">Australia</option>
            <option value="DE">Germany</option>
          </select>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" minlength="8" placeholder="••••••••" required autocomplete="new-password" />
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" minlength="8" placeholder="••••••••" required autocomplete="new-password" />
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="terms" name="terms" required />
          <label for="terms">I agree to the CareLink Terms of Service and Privacy Policy.</label>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn" disabled>Complete Registration</button>
      </form>
    </div>

    <script>
      const form = document.getElementById('signup-form');
      const submitBtn = document.getElementById('submit-btn');
      const pw = document.getElementById('password');
      const cpw = document.getElementById('confirm_password');
      const terms = document.getElementById('terms');

      function validateForm() {
        const isValid = form.checkValidity() &&
                        pw.value.length >= 8 &&
                        pw.value === cpw.value &&
                        terms.checked;
        submitBtn.disabled = !isValid;
      }

      form.addEventListener('input', validateForm);
      form.addEventListener('change', validateForm);
    </script>
  </body>
</html>
