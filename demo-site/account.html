<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Patient Account — CareLink Portal</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --primary: #1a56a0; --primary-dark: #0e3d7a; --primary-lt: #e8f0fb;
        --secondary: #107040; --bg-page: #f8fafc; --card-bg: #ffffff;
        --border-color: #cbd5e1; --text-main: #0f172a; --text-muted: #475569;
        --radius: 8px; --shadow: 0 4px 12px rgba(0,0,0,0.06);
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg-page); color: var(--text-main); line-height: 1.5; padding: 40px 15px;
      }
      .container {
        max-width: 680px; margin: 0 auto; background: var(--card-bg); border-radius: var(--radius);
        padding: 36px 32px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
      }
      .badge-success {
        display: inline-block; padding: 6px 12px; background: #dcfce7; color: #166534;
        border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 16px;
      }
      h1 { font-size: 26px; color: var(--primary-dark); margin-bottom: 8px; }
      p.welcome-text { color: var(--text-muted); font-size: 15px; margin-bottom: 24px; }
      .account-card {
        background: var(--primary-lt); border-radius: var(--radius); padding: 20px; margin-bottom: 24px;
        border: 1px solid #bfdbfe;
      }
      .account-card h2 { font-size: 16px; color: var(--primary-dark); margin-bottom: 8px; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; }
      .btn {
        display: inline-block; padding: 10px 18px; border-radius: var(--radius); font-size: 14px;
        font-weight: 600; text-decoration: none; cursor: pointer; text-align: center;
      }
      .btn-primary { background: var(--primary); color: white; }
      .btn-secondary { background: white; color: var(--primary); border: 1px solid var(--border-color); }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge-success">✓ Verification Complete</div>
      <h1>Welcome, you're signed in!</h1>
      <p class="welcome-text">Your CareLink patient portal account is active. You can now manage appointments and access records.</p>

      <div class="account-card">
        <h2>Active Account Status: Confirmed</h2>
        <p>Patient ID: #CL-884920 &bull; Security Level: High (2FA Verified)</p>
      </div>

      <div class="actions">
        <a href="timetable.html" class="btn btn-primary">View Medication Timetable</a>
        <a href="index.html" class="btn btn-secondary">Return to Portal Home</a>
      </div>
    </div>
  </body>
</html>
