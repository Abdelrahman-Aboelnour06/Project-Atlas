<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Home with Fixed Background & Hero Search Card</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
    }
    #fixed-bg-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e3a8a, #0284c7);
      z-index: 0;
    }
    header, .hero-section, .services-section {
      position: relative;
      z-index: 1;
    }
    header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
    }
    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 16px;
      font-weight: 500;
      font-size: 15px;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .hero-section {
      position: relative;
      height: 100vh;
      margin-top: -60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-search-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 450px;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      box-sizing: border-box;
    }
    .hero-search-card label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 16px;
    }
    .hero-search-card input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .hero-search-card button {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
    .services-section {
      padding: 40px 24px;
      background: #ffffff;
    }
    .services-section h2 {
      margin-top: 0;
    }
    .service-link {
      display: inline-block;
      margin-right: 16px;
      padding: 10px 16px;
      background: #f1f5f9;
      color: #1e3a8a;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <!-- Fixed full-viewport background layer (Pattern B negative candidate) -->
  <div id="fixed-bg-layer"></div>

  <header>
    <div style="color: #fff; font-weight: bold; font-size: 18px;">Citizen Portal</div>
    <nav>
      <a id="nav-services-link" href="#services">Services</a>
      <a id="nav-news-link" href="#news">News</a>
      <a id="nav-contact-link" href="#contact">Contact Us</a>
    </nav>
  </header>

  <!-- Hero section covering viewport with centered search card -->
  <section class="hero-section">
    <div class="hero-search-card">
      <label for="hero-search-input">Search Government Services</label>
      <input id="hero-search-input" type="search" placeholder="Type a service or query..." aria-label="Search Services" />
      <button id="hero-search-btn" type="button">Search</button>
    </div>
  </section>

  <!-- Content section below hero -->
  <section class="services-section">
    <h2>Popular Public Inquiries</h2>
    <a id="link-violations" class="service-link" href="#violations">Traffic Violations Inquiry</a>
    <a id="link-licensing" class="service-link" href="#licensing">Commercial Licensing</a>
  </section>
</body>
</html>
